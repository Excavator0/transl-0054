<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ruslan_aukhadyev</title>
</head>
<body>
  <input id="word" type="text" autocomplete="off">
  <h1 id="out"></h1>
  <script>
    const input = document.getElementById("word");
    const out = document.getElementById("out");
    let requested = "";
    let shownFor = "";

    async function fromYandex(text) {
      const response = await fetch(
        "https://dictionary.yandex.net/dicservice.json/lookup?ui=ru&lang=ru-en&text=" +
          encodeURIComponent(text)
      );
      const data = await response.json();
      const entry = data.def && data.def[0];
      const value = entry && entry.tr && entry.tr[0] && entry.tr[0].text;
      return value || "";
    }

    async function fromGoogle(text) {
      const response = await fetch(
        "https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=" +
          encodeURIComponent(text)
      );
      const data = await response.json();
      return data[0].map(part => part[0]).join("");
    }

    async function translate(text) {
      try {
        const value = await fromYandex(text);
        if (value) return value;
      } catch (err) {}
      if (text.toLowerCase() !== text) {
        try {
          const value = await fromYandex(text.toLowerCase());
          if (value) return value;
        } catch (err) {}
      }
      try {
        const value = await fromGoogle(text);
        if (value) return value;
      } catch (err) {}
      return "";
    }

    async function sync() {
      const text = input.value.trim();
      if (!text) {
        out.textContent = "";
        requested = "";
        shownFor = "";
        return;
      }
      if (text === shownFor || text === requested) return;
      requested = text;
      const value = await translate(text);
      if (input.value.trim() !== text) return;
      if (!value) {
        requested = "";
        return;
      }
      out.textContent = value;
      shownFor = text;
    }

    input.addEventListener("input", sync);
    input.addEventListener("change", sync);
    setInterval(sync, 200);
    sync();
  </script>
</body>
</html>
